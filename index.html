<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tauheed Model School — Online Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #0b6b4f;
      --green-dark: #064936;
      --green-light: #eaf7f2;
      --gold: #c9a227;
      --bg: #f5f7f6;
      --card: #ffffff;
      --text: #17221e;
      --muted: #718078;
      --border: #e4e9e6;
      --danger: #c0392b;
      --danger-bg: #fff0ee;
      --success: #16865b;
      --shadow: 0 12px 35px rgba(16, 37, 29, .08);
      --radius: 18px;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top left, #dff4eb 0, transparent 35%),
        radial-gradient(circle at bottom right, #eef5df 0, transparent 35%),
        var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 38px;
      box-shadow: var(--shadow);
    }

    .school-logo {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 27px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(11,107,79,.22);
    }

    .login-card h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .login-card .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 14px;
    }

    .role-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #f1f4f2;
      border-radius: 13px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .role-tab {
      border: 0;
      background: transparent;
      padding: 11px 5px;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
    }

    .role-tab.active {
      background: white;
      color: var(--green);
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper .input {
  padding-right: 48px;
}

.toggle-password {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: transparent;
  padding: 5px;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
}
    
    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      padding: 13px 14px;
      border-radius: 12px;
      outline: none;
      color: var(--text);
      transition: .2s;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(11,107,79,.08);
    }

    .textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 17px;
      font-weight: 750;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      background: var(--green-dark);
    }

    .btn-secondary {
      background: #eef3f0;
      color: var(--green-dark);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .btn-small {
      padding: 8px 11px;
      font-size: 12px;
      border-radius: 9px;
    }

    .full {
      width: 100%;
    }

    .error-box,
    .success-box {
      padding: 12px 14px;
      border-radius: 11px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error-box {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .success-box {
      background: #eaf8f1;
      color: var(--success);
    }

    /* =========================
       APP
    ========================= */

    #app {
      min-height: 100vh;
    }

    .topbar {
      height: 72px;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      margin-top: 2px;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      background: var(--green-light);
      color: var(--green-dark);
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .app-layout {
      display: flex;
      min-height: calc(100vh - 72px);
    }

    .sidebar {
      width: 245px;
      background: #fff;
      border-right: 1px solid var(--border);
      padding: 22px 15px;
      flex-shrink: 0;
    }

    .nav-title {
      color: #9aa59f;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin: 8px 12px 9px;
    }

    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #5e6d65;
      text-align: left;
      padding: 11px 13px;
      border-radius: 11px;
      margin-bottom: 3px;
      font-weight: 650;
      font-size: 13px;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--green-light);
      color: var(--green-dark);
    }

    .main {
      flex: 1;
      padding: 28px;
      min-width: 0;
    }

    .page-title {
      font-size: 27px;
      margin-bottom: 5px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* =========================
       CARDS / STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.025);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 29px;
      font-weight: 850;
      color: var(--green-dark);
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 5px 18px rgba(0,0,0,.025);
      padding: 22px;
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 17px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    /* =========================
       TABLES
    ========================= */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      text-align: left;
      color: #849089;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 11px 10px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 13px 10px;
      border-bottom: 1px solid #edf0ee;
      font-size: 13px;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 750;
    }

    .badge-green {
      background: #e9f8f0;
      color: #16704f;
    }

    .badge-gray {
      background: #f0f2f1;
      color: #68756e;
    }

    .badge-red {
      background: #fff0ee;
      color: #bd3c30;
    }

    /* =========================
       TEST BUILDER
    ========================= */

    .question-builder {
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 14px;
      background: #fbfcfb;
    }

    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .question-number {
      font-weight: 800;
      color: var(--green-dark);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .option-row {
      position: relative;
    }

    .option-label {
      position: absolute;
      left: 10px;
      top: 12px;
      font-size: 12px;
      font-weight: 800;
      color: var(--green);
    }

    .option-row .input {
      padding-left: 32px;
    }

    .marks-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .marks-input {
      width: 90px;
    }

    /* =========================
       TEST CARDS
    ========================= */

    .test-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .test-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 18px;
      transition: .2s;
    }

    .test-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .test-subject {
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .test-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .test-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .test-actions {
      margin-top: 15px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* =========================
       EXAM
    ========================= */

    .exam-header {
      position: sticky;
      top: 72px;
      z-index: 20;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      box-shadow: 0 7px 20px rgba(0,0,0,.05);
    }

    .timer {
      background: #fff3dc;
      color: #9b6500;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 18px;
      font-weight: 850;
      min-width: 100px;
      text-align: center;
    }

    .timer.danger {
      background: #fff0ee;
      color: var(--danger);
    }

    .exam-question {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 22px;
      margin-bottom: 14px;
    }

    .exam-q-number {
      color: var(--green);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .exam-q-text {
      font-size: 16px;
      font-weight: 750;
      line-height: 1.55;
      margin-bottom: 15px;
    }

    .answer-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: .15s;
    }

    .answer-option:hover {
      border-color: var(--green);
      background: var(--green-light);
    }

    .answer-option.selected {
      border-color: var(--green);
      background: var(--green-light);
    }

    .answer-option input {
      accent-color: var(--green);
    }

    .result-hero {
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      color: white;
      border-radius: 22px;
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
    }

    .result-score {
      font-size: 48px;
      font-weight: 900;
      margin: 8px 0;
    }

    /* =========================
       MODAL / LOADER
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 22, 16, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 70px rgba(0,0,0,.2);
    }

    .modal h3 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(3px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-box {
      background: white;
      padding: 20px 25px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 360px;
      padding: 13px 16px;
      border-radius: 12px;
      background: #1d2a24;
      color: white;
      z-index: 3000;
      box-shadow: var(--shadow);
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 5px;
    }

    .search-input {
      max-width: 300px;
    }

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .test-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 205px;
      }

      .main {
        padding: 18px;
      }

      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }

      .test-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 15px;
      }

      .brand-text {
        display: none;
      }

      .sidebar {
        position: fixed;
        left: 0;
        bottom: 0;
        top: 72px;
        width: 68px;
        z-index: 90;
        padding: 12px 8px;
      }

      .nav-title {
        display: none;
      }

      .nav-btn {
        text-align: center;
        padding: 12px 5px;
        font-size: 10px;
      }

      .main {
        margin-left: 68px;
        padding: 15px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-value {
        font-size: 24px;
      }

      .login-card {
        padding: 25px 20px;
      }

      .options-grid {
        grid-template-columns: 1fr;
      }

      .exam-header {
        top: 72px;
        padding: 12px;
      }

      .timer {
        font-size: 15px;
        min-width: 80px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOADER
  ====================================================== -->

  <div id="loader" class="hidden">
    <div class="loader-box" id="loaderText">Loading...</div>
  </div>

  <!-- =====================================================
       LOGIN
  ====================================================== -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="school-logo">TMS</div>

      <h1>Tauheed Model School</h1>

      <div class="subtitle">
        Secure Online Examination Portal
      </div>

      <div class="role-tabs">
        <button class="role-tab active" data-role="student">
          Student
        </button>

        <button class="role-tab" data-role="teacher">
          Teacher
        </button>

        <button class="role-tab" data-role="admin">
          Admin
        </button>
      </div>

      <div id="loginError" class="error-box hidden"></div>

      <form id="loginForm">

        <div class="form-group">
          <label>Username</label>
          <input
            id="loginUsername"
            class="input"
            autocomplete="username"
            placeholder="Enter username"
            required
          >
        </div>

        <div class="form-group">
          <label>Password</label>
        <div class="password-wrapper">
  <input 
    id="loginPassword" 
    class="input" 
    type="password" 
    autocomplete="current-password" 
    placeholder="Enter password" 
    required 
  >
  <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁</button>
</div> 
        </div>

        <button class="btn btn-primary full" type="submit">
          Sign In
        </button>

      </form>

    </div>

  </section>


  <!-- =====================================================
       APPLICATION
  ====================================================== -->

  <section id="app" class="hidden">

    <header class="topbar">

      <div class="brand">
        <div class="brand-icon">T</div>

        <div class="brand-text">
          Tauheed Model School
          <small>Online Examination Portal</small>
        </div>
      </div>

      <div class="top-user">

        <span id="topUser" class="user-pill">
          User
        </span>

        <button
          id="logoutBtn"
          class="btn btn-secondary btn-small"
        >
          Logout
        </button>

      </div>

    </header>


    <div class="app-layout">

      <aside class="sidebar">
        <div id="navigation"></div>
      </aside>

      <main class="main" id="mainContent"></main>

    </div>

  </section>


  <!-- =====================================================
       MODAL
  ====================================================== -->

  <div id="modalBackdrop" class="modal-backdrop hidden">

    <div class="modal">

      <h3 id="modalTitle"></h3>

      <p id="modalMessage"></p>

      <div class="modal-actions">

        <button
          id="modalCancel"
          class="btn btn-secondary"
        >
          Cancel
        </button>

        <button
          id="modalConfirm"
          class="btn btn-danger"
        >
          Confirm
        </button>

      </div>

    </div>

  </div>


  <div id="toast" class="toast hidden"></div>


<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ykvegtlzgzyfwmlvmpti.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_elTo8AsqYV5HQs5RG26OFg_IPsqv1UW";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentRole = "student";
let currentUser = null;
let currentProfile = null;

let adminData = null;
let teacherData = null;
let studentData = null;

let currentExam = null;
let examAnswers = {};
let examTimer = null;
let examSecondsRemaining = 0;

let modalResolve = null;


/* =========================================================
   DOM
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const mainContent =
  document.getElementById("mainContent");

const navigation =
  document.getElementById("navigation");

const topUser =
  document.getElementById("topUser");

const loader =
  document.getElementById("loader");

const loaderText =
  document.getElementById("loaderText");

const toast =
  document.getElementById("toast");


/* =========================================================
   HELPERS
========================================================= */

function showLoader(text = "Loading...") {
  loaderText.textContent = text;
  loader.classList.remove("hidden");
}

function hideLoader() {
  loader.classList.add("hidden");
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showToast(message, type = "normal") {

  toast.textContent = message;

  toast.style.background =
    type === "error"
      ? "#b93228"
      : type === "success"
        ? "#16724f"
        : "#1d2a24";

  toast.classList.remove("hidden");

  setTimeout(() => {
    toast.classList.add("hidden");
  }, 3500);
}

function showLoginError(message) {
  const box =
    document.getElementById("loginError");

function formatDate(date) {

  if (!date) return "—";

  return new Date(date).toLocaleString(
    undefined,
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );
}

function percent(score, total) {

  if (!total) return 0;

  return Math.round(
    (Number(score) / Number(total)) * 100
  );
}

function authEmail(username) {
  return `${String(username).trim().toLowerCase()}@tauheed.local`;
}


/* =========================================================
   MODAL
========================================================= */

function confirmAction(title, message, confirmText = "Confirm") {

  return new Promise(resolve => {

    modalResolve = resolve;

    document.getElementById("modalTitle").textContent =
      title;

    document.getElementById("modalMessage").textContent =
      message;

    document.getElementById("modalConfirm").textContent =
      confirmText;

    document
      .getElementById("modalBackdrop")
      .classList.remove("hidden");
  });
}

function closeModal(result) {

  document
    .getElementById("modalBackdrop")
    .classList.add("hidden");

  if (modalResolve) {
    modalResolve(result);
    modalResolve = null;
  }
}

document
  .getElementById("modalCancel")
  .addEventListener(
    "click",
    () => closeModal(false)
  );

document
  .getElementById("modalConfirm")
  .addEventListener(
    "click",
    () => closeModal(true)
  );


/* =========================================================
   EDGE FUNCTION CALL
========================================================= */

async function callFunction(
  functionName,
  payload
) {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    throw new Error(
      "Your session has expired. Please sign in again."
    );
  }

  const response =
    await fetch(
      `${SUPABASE_URL}/functions/v1/${functionName}`,
      {
        method: "POST",

        headers: {
          "Authorization":
            `Bearer ${session.access_token}`,

          "apikey":
            SUPABASE_PUBLISHABLE_KEY,

          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(payload)
      }
    );

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {

    throw new Error(
      data.error ||
      data.message ||
      `Request failed (${response.status})`
    );
  }

  return data;
}

/* =========================================================
   DETERMINE ROLE
========================================================= */

async function determineRole() {

  try {

    const data =
      await callFunction(
        "portal-data",
        {
          action: "get_profile"
        }
      );

    if (
      !data ||
      !data.success ||
      !data.role ||
      !data.profile
    ) {
      throw new Error(
        "Your account exists, but no Student, Teacher or Admin profile is linked to it."
      );
    }


    /* =====================================================
       ADMIN
    ===================================================== */

    if (
      data.role === "admin"
    ) {

      currentRole = "admin";

      currentProfile =
        data.profile;

      return;
    }


    /* =====================================================
       TEACHER
    ===================================================== */

    if (
      data.role === "teacher"
    ) {

      currentRole = "teacher";

      currentProfile =
        data.profile;

      return;
    }


    /* =====================================================
       STUDENT
    ===================================================== */

    if (
      data.role === "student"
    ) {

      currentRole = "student";

      currentProfile =
        data.profile;

      return;
    }


    throw new Error(
      "Invalid account role."
    );

  } catch (error) {

    console.error(
      "Role detection error:",
      error
    );

    throw new Error(
      error.message ||
      "Unable to determine account role."
    );
  }
}

function addQuestion() {

  questionCount++;

  const container =
    document.getElementById(
      "questionsContainer"
    );

  const div =
    document.createElement("div");

  div.className =
    "question-builder";

  div.dataset.question =
    questionCount;

  div.innerHTML = `

    <div class="question-top">

      <div class="question-number">
        Question ${questionCount}
      </div>

      ${
        questionCount > 1
          ? `
            <button
              type="button"
              class="btn btn-danger btn-small remove-question"
            >
              Remove
            </button>
          `
          : ""
      }

    </div>


    <div class="form-group">

      <label>Question</label>

      <textarea
        class="textarea question-text"
        placeholder="Enter question"
        required
      ></textarea>

    </div>


    <div class="options-grid">

      <div class="option-row">
        <span class="option-label">A</span>
        <input
          class="input option-a"
          placeholder="Option A"
          required
        >
      </div>

      <div class="option-row">
        <span class="option-label">B</span>
        <input
          class="input option-b"
          placeholder="Option B"
          required
        >
      </div>

      <div class="option-row">
        <span class="option-label">C</span>
        <input
          class="input option-c"
          placeholder="Option C"
          required
        >
      </div>

      <div class="option-row">
        <span class="option-label">D</span>
        <input
          class="input option-d"
          placeholder="Option D"
          required
        >
      </div>

    </div>


    <div class="marks-row">

      <label>
        Correct Answer
      </label>

      <select
        class="select correct-option"
        style="width:90px"
      >
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>


      <label>
        Marks
      </label>

      <input
        class="input marks-input question-marks"
        type="number"
        min="1"
        value="1"
        required
      >

    </div>
  `;


  container.appendChild(div);


  const removeButton =
    div.querySelector(
      ".remove-question"
    );

  if (removeButton) {

    removeButton.addEventListener(
      "click",
      () => {

        div.remove();

        renumberQuestions();
      }
    );
  }
}


function renumberQuestions() {

  document
    .querySelectorAll(
      ".question-builder"
    )
    .forEach(
      (element, index) => {

        element
          .querySelector(
            ".question-number"
          )
          .textContent =
            `Question ${index + 1}`;
      }
    );
}


async function createTest(event) {

  event.preventDefault();

  const questionElements =
    Array.from(
      document.querySelectorAll(
        ".question-builder"
      )
    );

  if (!questionElements.length) {

    showToast(
      "Add at least one question.",
      "error"
    );

    return;
  }


  const questions =
    questionElements.map(element => ({

      question_text:
        element
          .querySelector(".question-text")
          .value
          .trim(),

      option_a:
        element
          .querySelector(".option-a")
          .value
          .trim(),

      option_b:
        element
          .querySelector(".option-b")
          .value
          .trim(),

      option_c:
        element
          .querySelector(".option-c")
          .value
          .trim(),

      option_d:
        element
          .querySelector(".option-d")
          .value
          .trim(),

      correct_option:
        element
          .querySelector(".correct-option")
          .value,

      marks:
        Number(
          element
            .querySelector(".question-marks")
            .value
        )
    }));


  showLoader("Creating test...");

  try {

    const result =
      await callFunction(
        "teacher-manage-tests",
        {
          action:
            "create_test",

          title:
            document
              .getElementById("testTitle")
              .value
              .trim(),

          class_name:
            document
              .getElementById("testClass")
              .value
              .trim(),

          subject:
            document
              .getElementById("testSubject")
              .value
              .trim(),

          chapter:
            document
              .getElementById("testChapter")
              .value
              .trim(),

          duration_minutes:
            Number(
              document
                .getElementById("testDuration")
                .value
            ),

          questions
        }
      );


    showToast(
      `Test created successfully. Total marks: ${result.total_marks}`,
      "success"
    );

    await showTeacherTests();

  } catch (error) {

    showToast(
      error.message,
      "error"
    );

  } finally {

    hideLoader();
  }
}

/* =========================================================
   START TEST
========================================================= */

async function startTest(testId) {

  const confirmed =
    await confirmAction(
      "Start Examination?",
      "Once you start this examination, your attempt will be recorded when you submit it. You can only attempt each test once.",
      "Start Test"
    );

  if (!confirmed) return;

  showLoader("Loading examination...");

  try {

    const data =
      await callFunction(
        "student-test-system",
        {
          action:
            "get_test",

          test_id:
            testId
        }
      );

    currentExam = data;

    examAnswers = {};

    startExamTimer(
      Number(
        data.test.duration_minutes
      ) * 60
    );

    renderExam();

  } catch (error) {

    if (
      error.message
        .toLowerCase()
        .includes("already attempted")
    ) {

      showToast(
        "You have already attempted this test.",
        "error"
      );

      await showStudentTests();

    } else {

      showToast(
        error.message,
        "error"
      );
    }

  } finally {

    hideLoader();
  }
}


/* =========================================================
   EXAM TIMER
========================================================= */

function startExamTimer(seconds) {

  clearInterval(examTimer);

  examSecondsRemaining =
    seconds;

  updateTimerDisplay();

  examTimer =
    setInterval(
      () => {

        examSecondsRemaining--;

        updateTimerDisplay();

        if (
          examSecondsRemaining <= 0
        ) {

          clearInterval(examTimer);

          showToast(
            "Time is up. Your test is being submitted.",
            "error"
          );

          submitExam(true);
        }

      },
      1000
    );
}


function updateTimerDisplay() {

  const timer =
    document.getElementById(
      "examTimer"
    );

  if (!timer) return;

  const minutes =
    Math.floor(
      examSecondsRemaining / 60
    );

  const seconds =
    examSecondsRemaining % 60;

  timer.textContent =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

  if (
    examSecondsRemaining <= 60
  ) {
    timer.classList.add("danger");
  } else {
    timer.classList.remove("danger");
  }
}

        "change",

              input.dataset.questionId

            questionId

            input.value;

          document
            .querySelectorAll(
              `.answer-option[data-question-id="${questionId}"]`

            .forEach(

                element.classList.remove(

            );

            .closest(".answer-option")
            .classList.add("selected");
        }
      );
    });

}


function renderAnswerOption(
  question,
  letter,
  text
) {

  return `

    <label
      class="answer-option"
      data-question-id="${question.id}"
    >

      <input

        name="question_${question.id}"
        value="${letter}"

      <strong>
        ${letter}.
      </strong>

      <span>
        ${escapeHTML(text)}
      </span>

    </label>

  `;
}


/* =========================================================
   SUBMIT EXAM
========================================================= */

async function submitExam(
  automatic = false
) {

  if (!automatic) {

    const confirmed =
      await confirmAction(
        "Submit Test?",
        "Your answers will be marked automatically and this test cannot be attempted again after submission.",
        "Submit Test"
      );

    if (!confirmed) return;
  }


  clearInterval(examTimer);

  showLoader(
    automatic
      ? "Submitting automatically..."
      : "Submitting test..."
  );


  try {

    const answers =
      Object.entries(
        examAnswers
      ).map(
        ([question_id, selected_option]) => ({
          question_id:
            Number(question_id),

          selected_option
        })
      );


    const result =
      await callFunction(
        "student-test-system",
        {
          action:
            "submit_test",

          test_id:
            Number(
              currentExam.test.id
            ),

          answers
        }
      );


    showResultScreen(
      result
    );

  } catch (error) {

    showToast(
      error.message,
      "error"
    );

  } finally {

    hideLoader();
  }
}

/* =========================================================
   SESSION CHECK
========================================================= */

async function checkExistingSession() {

  try {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();

    if (!session) return;

    showLoader("Restoring session...");

    currentUser =
      session.user;

    await determineRole();

    loginScreen.classList.add("hidden");
    app.classList.remove("hidden");

    topUser.textContent =
      currentProfile?.name ||
      currentProfile?.Name ||
      currentProfile?.username ||
      currentProfile?.Username ||
      "User";

    buildNavigation();

    if (currentRole === "admin")
      await showAdminDashboard();

    else if (currentRole === "teacher")
      await showTeacherDashboard();

    else
      await showStudentDashboard();

  } catch (error) {

    console.error(
      "Session restore:",
      error
    );

    await supabaseClient.auth.signOut();

  } finally {

    hideLoader();
  }
}

      ${
        message
          ? `<span>${escapeHTML(message)}</span>`

/*
  Used only for values inserted into onclick attributes.
*/
function escapeAttr(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");
}

function togglePassword(inputOrId, button) {
  const input =
    typeof inputOrId === "string"
      ? document.getElementById(inputOrId)
      : inputOrId;

  if (!input) return;

  if (input.type === "password") {
    input.type = "text";
    button.textContent = "🙈";
  } else {
    input.type = "password";
    button.textContent = "👁";
  }
}
  function showPasswordPrompt(message) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");

    overlay.style.cssText = `
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    `;

    overlay.innerHTML = `
      <div style="
        width:100%;
        max-width:400px;
        background:white;
        border-radius:18px;
        padding:25px;
        box-shadow:0 20px 50px rgba(0,0,0,.2);
      ">
        <h3 style="margin-bottom:8px;">Create Password</h3>

        <p style="
          color:#718078;
          font-size:13px;
          margin-bottom:18px;
        ">${message}</p>

        <div class="password-wrapper">
          <input
            id="customPasswordInput"
            class="input"
            type="password"
            minlength="6"
            placeholder="Enter password"
            autocomplete="new-password"
          >

          <button
            type="button"
            class="toggle-password"
            id="customPasswordToggle"
          >👁</button>
        </div>

        <div style="
          display:flex;
          gap:10px;
          margin-top:18px;
        ">
          <button
            type="button"
            class="btn btn-secondary"
            id="customPasswordCancel"
            style="flex:1;"
          >Cancel</button>

          <button
            type="button"
            class="btn btn-primary"
            id="customPasswordOk"
            style="flex:1;"
          >Create</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    const input = overlay.querySelector("#customPasswordInput");
    const toggle = overlay.querySelector("#customPasswordToggle");
    const cancel = overlay.querySelector("#customPasswordCancel");
    const ok = overlay.querySelector("#customPasswordOk");

    toggle.addEventListener("click", () => {
      togglePassword(input, toggle);
    });

    cancel.addEventListener("click", () => {
      overlay.remove();
      resolve(null);
    });

    ok.addEventListener("click", () => {
      const password = input.value.trim();

      if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        input.focus();
        return;
      }

      overlay.remove();
      resolve(password);
    });

    input.focus();
  });
}
  
  function setupPasswordToggles(root = document) {
  root.querySelectorAll('input[type="password"]').forEach(input => {
    if (input.closest(".password-wrapper")) return;

    const wrapper = document.createElement("div");
    wrapper.className = "password-wrapper";

    input.parentNode.insertBefore(wrapper, input);
    wrapper.appendChild(input);

    const button = document.createElement("button");
    button.type = "button";
    button.className = "toggle-password";
    button.textContent = "👁";
    button.setAttribute("aria-label", "Show password");

    button.addEventListener("click", () => {
      togglePassword(input, button);

      button.setAttribute(
        "aria-label",
        input.type === "password" ? "Show password" : "Hide password"
      );
    });

    wrapper.appendChild(button);
  });
}

setupPasswordToggles();
  const passwordObserver = new MutationObserver(mutations => {
  mutations.forEach(mutation => {
    mutation.addedNodes.forEach(node => {
      if (node.nodeType === 1) {
        setupPasswordToggles(node);
      }
    });
  });
});

passwordObserver.observe(document.body, {
  childList: true,
  subtree: true
});
  
</script>
